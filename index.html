<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anime X Zone</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
    }

    header {
      background: #15151d;
      padding: 18px;
      text-align: center;
      border-bottom: 2px solid #e50914;
    }

    header h1 {
      color: #ff1744;
      font-size: 28px;
    }

    header p {
      color: #aaa;
      margin-top: 5px;
    }

    .search {
      padding: 20px;
      text-align: center;
    }

    .search input {
      width: 90%;
      max-width: 500px;
      padding: 13px;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .container {
      padding: 15px;
    }

    .section-title {
      margin: 25px 0 15px;
      border-left: 4px solid #ff1744;
      padding-left: 10px;
    }

    .anime-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .anime-card {
      background: #17171f;
      border-radius: 10px;
      overflow: hidden;
      transition: 0.3s;
    }
